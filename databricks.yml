bundle:
  name: clientes_base

include:
  - resources/*.yml

variables:
  catalog:
    description: Existing Unity Catalog catalog
    default: datosami
  schema:
    description: Esquema existente donde viven las tablas clientes_base_* (sin permiso CREATE SCHEMA en datosami)
    default: datos
  clientes_base_path:
    description: Carpeta del volumen con los DBF de SIGEL en subcarpetas AAAA/MM
    default: /Volumes/datosami/datos/clientes_base
  clientes_base_periodo:
    description: Periodo a ingerir - ultimo (ultima carpeta AAAA/MM), todos o AAAA-MM
    default: ultimo
  warehouse_id:
    description: SQL warehouse existente para inicializar clientes_base

targets:
  dev:
    default: true
    mode: development
    variables:
      warehouse_id: fac1da9aa4b8e6dd # Serverless Starter Warehouse
